        &lt;div class=&quot;ht&quot;&gt;&lt;div class=&quot;name&quot;&gt;${E(name)}&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;span class=&quot;dot inline-dot ${status}&quot;&gt;&lt;/span&gt; ${E(sub)}&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;`;
    const kpis = (items) =&gt; `&lt;div class=&quot;kpis&quot;&gt;${items.map(([value, label, cls = &#x27;&#x27;]) =&gt; `&lt;div class=&quot;kpi ${cls}&quot;&gt;&lt;div class=&quot;v&quot;&gt;${value}&lt;/div&gt;&lt;div class=&quot;l&quot;&gt;${E(label)}&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`;
    const bar = (label, percent, text, cls) =&gt; `&lt;div class=&quot;barx&quot;&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;${E(label)}&lt;/span&gt;&lt;span&gt;${E(text ?? `${num(percent)} %`)}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;track&quot;&gt;&lt;i class=&quot;${cls ?? &#x27;&#x27;}&quot; style=&quot;width:${clamp(percent)}%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;/div&gt;`;
    function ring(label, text, percent, cls = &#x27;&#x27;) {
        const c = 2 * Math.PI * 26;
        return `&lt;div class=&quot;ring&quot;&gt;&lt;svg width=&quot;62&quot; height=&quot;62&quot;&gt;&lt;circle class=&quot;bg&quot; cx=&quot;31&quot; cy=&quot;31&quot; r=&quot;26&quot; fill=&quot;none&quot; stroke-width=&quot;5&quot;/&gt;&lt;circle class=&quot;fg ${cls}&quot; cx=&quot;31&quot; cy=&quot;31&quot; r=&quot;26&quot; fill=&quot;none&quot; stroke-width=&quot;5&quot; stroke-linecap=&quot;round&quot; stroke-dasharray=&quot;${c * clamp(percent) / 100} ${c}&quot;/&gt;&lt;/svg&gt;&lt;div&gt;${E(text)}&lt;small&gt;${E(label)}&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;`;
    }
    // Zeilen ohne Wert entfallen; die erste sichtbare Zeile hat keine Trennlinie.
    const rows = (items) =&gt; `&lt;div class=&quot;rows&quot;&gt;${items.filter((r) =&gt; has(r[1])).map(([key, value, p], i) =&gt; `&lt;div class=&quot;row ${i === 0 ? &#x27;first&#x27; : &#x27;&#x27;}&quot; ${p ? `data-p=&quot;${p}&quot;` : &#x27;&#x27;}&gt;&lt;span&gt;${E(key)}&lt;/span&gt;&lt;span&gt;${value}&lt;/span&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`;
    const onOff = (value) =&gt; (value === undefined || value === null ? &#x27;&#x27; : `&lt;span class=&quot;${value ? &#x27;txtok&#x27; : &#x27;&#x27;}&quot;&gt;${E(T(value ? &#x27;On&#x27; : &#x27;Off&#x27;))}&lt;/span&gt;`);

    // Verbindungsstatus der Protect-Geraete
    const connState = (s) =&gt; ({ CONNECTED: &#x27;ok&#x27;, CONNECTING: &#x27;warn&#x27; }[s] || &#x27;err&#x27;);
    const connLabel = (s) =&gt; T({ CONNECTED: &#x27;Connected&#x27;, CONNECTING: &#x27;Connecting&#x27;, DISCONNECTED: &#x27;Disconnected&#x27; }[s] || (s || &#x27;Disconnected&#x27;));

    const deviceIcons = {
        &#x27;Camera&#x27;: &#x27;camera-cctv&#x27;, &#x27;UP-Sense&#x27;: &#x27;sensor&#x27;, &#x27;UP-AirQuality&#x27;: &#x27;wind&#x27;,
        &#x27;Chime&#x27;: &#x27;bell&#x27;, &#x27;Light&#x27;: &#x27;lightbulb&#x27;, &#x27;Speaker&#x27;: &#x27;speaker&#x27;, &#x27;Viewer&#x27;: &#x27;display&#x27;
    };

    function renderDevice(d) {
        const type = d.type || &#x27;Camera&#x27;;
        const sub = [d.model, connLabel(d.state)].filter(has).join(&#x27; · &#x27;);
        let body = &#x27;&#x27;;
        if (type === &#x27;Camera&#x27;) {
            const items = [];
            if (has(d.micVolume)) {
                items.push([`${num(d.micVolume)}&lt;small&gt; %&lt;/small&gt;`, T(&#x27;Microphone Volume&#x27;)]);
            }
            if (d.micEnabled !== undefined &amp;&amp; d.micEnabled !== null) {
                items.push([`&lt;span class=&quot;${d.micEnabled ? &#x27;txtok&#x27; : &#x27;&#x27;}&quot;&gt;${E(T(d.micEnabled ? &#x27;On&#x27; : &#x27;Off&#x27;))}&lt;/span&gt;`, T(&#x27;Microphone&#x27;), &#x27;wide-only&#x27;]);
            }
            if (items.length) {
                body += kpis(items);
            }
            body += rows([[T(&#x27;LCD Message&#x27;), has(d.lcdMessage) ? E(d.lcdMessage) : &#x27;&#x27;, 3]]);
            body += `&lt;div data-p=&quot;2&quot;&gt;&lt;button class=&quot;btn&quot; data-snapshot&gt;${icon(&#x27;camera-polaroid&#x27;)}&lt;span&gt;${E(T(&#x27;Create snapshot&#x27;))}&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;`;
        } else if (type === &#x27;Speaker&#x27;) {
            const statusLabels = { idle: &#x27;Idle&#x27;, streaming: &#x27;Streaming&#x27;, playing: &#x27;Playing&#x27;, tts_playing: &#x27;TTS Playing&#x27;, uploading: &#x27;Uploading&#x27; };
            body += `&lt;div class=&quot;state&quot;&gt;&lt;span class=&quot;big ${[&#x27;streaming&#x27;, &#x27;playing&#x27;, &#x27;tts_playing&#x27;].includes(d.speakerStatus) ? &#x27;txtok&#x27; : &#x27;&#x27;}&quot;&gt;${E(T(statusLabels[d.speakerStatus] || d.speakerStatus || &#x27;Idle&#x27;))}&lt;/span&gt;&lt;/div&gt;`;
            const items = [];
            if (has(d.volume)) {
                items.push([`${num(d.volume)}&lt;small&gt; %&lt;/small&gt;`, T(&#x27;Volume&#x27;)]);
            }
            if (has(d.micVolume)) {
                items.push([`${num(d.micVolume)}&lt;small&gt; %&lt;/small&gt;`, T(&#x27;Microphone Volume&#x27;), &#x27;wide-only&#x27;]);
            }
            if (items.length) {
                body += `&lt;div data-p=&quot;2&quot;&gt;${kpis(items)}&lt;/div&gt;`;
            }
            body += rows([
                [T(&#x27;Microphone&#x27;), onOff(d.micEnabled), 3],
                [T(&#x27;Speaker Mode&#x27;), has(d.speakerMode) ? E(T(d.speakerMode === &#x27;talk&#x27; ? &#x27;Talk&#x27; : &#x27;Listen&#x27;)) : &#x27;&#x27;, 4]
            ]);
        } else if (type === &#x27;UP-Sense&#x27;) {
            const items = [];
            if (has(d.temperature)) {
                items.push([`${num(d.temperature, 1)}&lt;small&gt; °C&lt;/small&gt;`, T(&#x27;Temperature&#x27;)]);
            }
            if (has(d.humidity)) {
                items.push([`${num(d.humidity)}&lt;small&gt; %&lt;/small&gt;`, T(&#x27;Humidity&#x27;)]);
            }
            if (has(d.illuminance)) {
                items.push([`${num(d.illuminance)}&lt;small&gt; lx&lt;/small&gt;`, T(&#x27;Illuminance&#x27;), &#x27;wide-only&#x27;]);
            }
            if (items.length) {
                body += kpis(items);
            }
            if (has(d.battery)) {
                body += bar(T(&#x27;Battery&#x27;), d.battery, `${num(d.battery)} %`, d.battery &lt;= 15 ? &#x27;err&#x27; : (d.battery &lt;= 30 ? &#x27;warn&#x27; : &#x27;&#x27;));
            }
        } else if (type === &#x27;UP-AirQuality&#x27;) {
            const aqiCls = d.aqi &gt;= 150 ? &#x27;err&#x27; : (d.aqi &gt;= 100 ? &#x27;warn&#x27; : &#x27;&#x27;);
            const items = [];
            if (has(d.co2)) {
                items.push([`${num(d.co2)}&lt;small&gt; ppm&lt;/small&gt;`, &#x27;CO2&#x27;]);
            }
            if (has(d.pm25)) {
                items.push([`${num(d.pm25, 1)}&lt;small&gt; µg/m³&lt;/small&gt;`, &#x27;PM2.5&#x27;]);
            }
            if (has(d.aqi)) {
                body += `&lt;div class=&quot;rings&quot;&gt;${ring(T(&#x27;Air Quality Index&#x27;), num(d.aqi), d.aqi / 500 * 100, aqiCls)}${items.length ? kpis(items) : &#x27;&#x27;}&lt;/div&gt;`;
            } else if (items.length) {
                body += kpis(items);
            }
            const climate = [];
            if (has(d.temperature)) {
                climate.push([`${num(d.temperature, 1)}&lt;small&gt; °C&lt;/small&gt;`, T(&#x27;Temperature&#x27;)]);
            }
            if (has(d.humidity)) {
                climate.push([`${num(d.humidity)}&lt;small&gt; %&lt;/small&gt;`, T(&#x27;Humidity&#x27;)]);
            }
            if (climate.length) {
                body += `&lt;div data-p=&quot;2&quot;&gt;${kpis(climate)}&lt;/div&gt;`;
            }
            body += rows([
                [T(&#x27;Vape Index&#x27;), has(d.vape) ? num(d.vape) : &#x27;&#x27;, 3],
                [&#x27;TVOC&#x27;, has(d.tvoc) ? `${num(d.tvoc)} ppb` : &#x27;&#x27;, 4],
                [&#x27;VOC&#x27;, has(d.voc) ? num(d.voc) : &#x27;&#x27;, 5],
                [&#x27;PM1.0&#x27;, has(d.pm1) ? `${num(d.pm1, 1)} µg/m³` : &#x27;&#x27;, 5],
                [&#x27;PM4.0&#x27;, has(d.pm4) ? `${num(d.pm4, 1)} µg/m³` : &#x27;&#x27;, 6],
                [&#x27;PM10&#x27;, has(d.pm10) ? `${num(d.pm10, 1)} µg/m³` : &#x27;&#x27;, 6]
            ]);
        } else {
            // Chime, Light, ...
            body += `&lt;div class=&quot;state&quot;&gt;&lt;span class=&quot;big ${connState(d.state) === &#x27;ok&#x27; ? &#x27;txtok&#x27; : &#x27;txterr&#x27;}&quot;&gt;${E(connLabel(d.state))}&lt;/span&gt;&lt;/div&gt;`;
        }
        return head(deviceIcons[type] || &#x27;circle-nodes&#x27;, d.name || type, sub, connState(d.state)) + body + &#x27;&lt;div class=&quot;foot&quot;&gt;&lt;/div&gt;&#x27;;
    }

    const eventLabels = {
        motion: &#x27;Motion&#x27;, smartDetectZone: &#x27;Smart Detection&#x27;, smartDetectLine: &#x27;Line crossing&#x27;,
        smartDetectLoiterZone: &#x27;Loitering&#x27;, smartAudioDetect: &#x27;Audio detection&#x27;, ring: &#x27;Ring&#x27;,
        sensorMotion: &#x27;Sensor motion&#x27;, sensorExtremeValues: &#x27;Extreme values&#x27;, sensorWaterLeak: &#x27;Water leak&#x27;,
        sensorTamper: &#x27;Tamper&#x27;, sensorBatteryLow: &#x27;Battery low&#x27;, sensorAlarm: &#x27;Alarm&#x27;,
        sensorOpened: &#x27;Opened&#x27;, sensorClosed: &#x27;Closed&#x27;, sensorSmokeTest: &#x27;Smoke test&#x27;, lightMotion: &#x27;Light motion&#x27;
    };
    const eventLabel = (type) =&gt; T(eventLabels[type] || type);

    function renderEvents(s) {
        const events = s.events || [];
        const active = events.length &gt; 0;
        const sub = active ? `${num(events.length)} ${T(events.length === 1 ? &#x27;active event&#x27; : &#x27;active events&#x27;)}` : T(&#x27;No active events&#x27;);
        let body = kpis([[`&lt;span class=&quot;${active ? &#x27;txtwarn&#x27; : &#x27;&#x27;}&quot;&gt;${num(events.length)}&lt;/span&gt;`, T(&#x27;Active events&#x27;)]]);
        if (active) {
            const now = Date.now() / 1000;
            body += `&lt;div class=&quot;evs&quot; data-p=&quot;2&quot;&gt;${events.slice(0, 8).map((ev, i) =&gt; `&lt;div class=&quot;ev ${i === 0 ? &#x27;first&#x27; : &#x27;&#x27;}&quot;&gt;
                &lt;span class=&quot;dot warn&quot;&gt;&lt;/span&gt;
                &lt;div class=&quot;d&quot;&gt;&lt;div&gt;${E(eventLabel(ev.type))}&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;${E(ev.device || &#x27;&#x27;)}&lt;/div&gt;&lt;/div&gt;
                ${ev.start &gt; 0 ? `&lt;span class=&quot;rt&quot;&gt;${E(since(now - ev.start))}&lt;/span&gt;` : &#x27;&#x27;}&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`;
        }
        const globals = (s.globals || []);
        if (globals.length) {
            body += `&lt;div class=&quot;chips wide-only&quot; data-p=&quot;3&quot;&gt;${globals.map((g) =&gt; `&lt;span class=&quot;chip ${g.active ? &#x27;warn&#x27; : &#x27;&#x27;}&quot;&gt;${E(eventLabel(g.type))}&lt;/span&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`;
        }
        return head(&#x27;sensor&#x27;, s.name || &#x27;UniFi Protect&#x27;, sub, active ? &#x27;warn&#x27; : &#x27;ok&#x27;) + body + &#x27;&lt;div class=&quot;foot&quot;&gt;&lt;/div&gt;&#x27;;
    }

    function renderAlarm(a) {
        const status = String(a.status || &#x27;&#x27;).toLowerCase();
        const statusMap = {
            disabled: [&#x27;Disarmed&#x27;, &#x27;&#x27;, &#x27;err&#x27;],
            arming: [&#x27;Arming&#x27;, &#x27;txtwarn&#x27;, &#x27;warn&#x27;],
            armed: [&#x27;Armed&#x27;, &#x27;txtok&#x27;, &#x27;ok&#x27;],
            disarming: [&#x27;Disarming&#x27;, &#x27;txtwarn&#x27;, &#x27;warn&#x27;],
            breach: [&#x27;Breach&#x27;, &#x27;txterr&#x27;, &#x27;err&#x27;]
        };
        const [label, cls, dot] = statusMap[status] || [a.status || &#x27;—&#x27;, &#x27;&#x27;, &#x27;err&#x27;];
        const armed = a.armed === true;
        let body = `&lt;div class=&quot;state&quot;&gt;&lt;div&gt;&lt;span class=&quot;big ${cls}&quot; id=&quot;alarmState&quot;&gt;${E(T(label))}&lt;/span&gt;
            ${a.armedAt &gt; 0 &amp;&amp; armed ? `&lt;div class=&quot;sub&quot;&gt;${E(since(Date.now() / 1000 - a.armedAt))}&lt;/div&gt;` : &#x27;&#x27;}&lt;/div&gt;
            &lt;button class=&quot;toggle&quot; role=&quot;switch&quot; aria-checked=&quot;${armed}&quot; aria-label=&quot;Alarm&quot;&gt;&lt;/button&gt;&lt;/div&gt;`;
        if (a.breach) {
            body += `&lt;div class=&quot;state&quot;&gt;&lt;span class=&quot;txterr&quot;&gt;${icon(&#x27;triangle-exclamation&#x27;)} ${E(T(&#x27;Breach detected&#x27;))}&lt;/span&gt;&lt;/div&gt;`;
        }
        const profiles = a.profiles || [];
        if (profiles.length) {
            // Profilwechsel nur im unscharfen Zustand anbieten
            body += `&lt;div class=&quot;chips&quot; data-p=&quot;2&quot;&gt;${profiles.map((p) =&gt; `&lt;button class=&quot;chip ${p.id === a.currentProfile ? &#x27;on&#x27; : &#x27;&#x27;}&quot; data-profile=&quot;${E(p.id)}&quot; ${armed ? &#x27;disabled&#x27; : &#x27;&#x27;}&gt;${E(p.name)}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`;
        }
        body += rows([[T(&#x27;Active Profile&#x27;), has(a.profile) ? E(a.profile) : &#x27;&#x27;, 3]]);
        return head(&#x27;shield-halved&#x27;, a.name || &#x27;Alarm&#x27;, [T(&#x27;Alarm Profile&#x27;), has(a.profile) ? a.profile : &#x27;&#x27;].filter(has).join(&#x27;: &#x27;), dot) + body + &#x27;&lt;div class=&quot;foot&quot;&gt;&lt;/div&gt;&#x27;;
    }

    function renderWebhooks(w) {
        const hooks = w.hooks || [];
        const sub = `${num(hooks.length)} ${T(hooks.length === 1 ? &#x27;webhook&#x27; : &#x27;webhooks&#x27;)}`;
        let body;
        if (hooks.length) {
            body = `&lt;div class=&quot;hooks&quot;&gt;${hooks.map((h) =&gt; `&lt;button class=&quot;btn&quot; data-hook=&quot;${E(h.ident)}&quot;&gt;${icon(&#x27;bell-ring&#x27;)}&lt;span&gt;${E(h.name)}&lt;/span&gt;&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`;
        } else {
            body = `&lt;div class=&quot;empty&quot;&gt;${E(T(&#x27;No webhooks configured&#x27;))}&lt;/div&gt;`;
        }
        return head(&#x27;bell-ring&#x27;, w.name || &#x27;Webhooks&#x27;, sub, hooks.length ? &#x27;ok&#x27; : &#x27;warn&#x27;) + body + &#x27;&lt;div class=&quot;foot&quot;&gt;&lt;/div&gt;&#x27;;
    }

    const renderers = { device: renderDevice, events: renderEvents, alarm: renderAlarm, webhooks: renderWebhooks };

    function render() {
        if (!state || !state.kind || !renderers[state.kind]) {
            return;
        }
        if (state.inactive) {
            box.innerHTML = `&lt;div class=&quot;empty&quot;&gt;${E(T(&#x27;Instance inactive&#x27;))}&lt;/div&gt;`;
            return;
        }
        if (state.kind === &#x27;device&#x27; &amp;&amp; !state.name &amp;&amp; !state.model) {
            box.innerHTML = `&lt;div class=&quot;empty&quot;&gt;${E(T(&#x27;No data yet&#x27;))}&lt;/div&gt;`;
            return;
        }
        box.innerHTML = renderers[state.kind](state);
        box.classList.toggle(&#x27;off&#x27;, state.kind === &#x27;device&#x27; &amp;&amp; connState(state.state) === &#x27;err&#x27;);
        fit();
    }

    // Passt den Inhalt in die Kachel ein: erst die Groessenklassen, dann wird alles,
    // was mit data-p markiert ist, ausgeblendet (hoechste Zahl zuerst), bis nichts mehr ueberlaeuft.
    function fit() {
        const width = box.clientWidth - padSide * 2, height = box.clientHeight - padTop - padBottom;
        document.body.classList.toggle(&#x27;narrow&#x27;, width &lt; 200);
        document.body.classList.toggle(&#x27;short&#x27;, height &lt; 200);
        box.querySelectorAll(&#x27;.hid&#x27;).forEach((e) =&gt; e.classList.remove(&#x27;hid&#x27;));
        const overflow = () =&gt; box.scrollHeight &gt; box.clientHeight + 1;
        const steps = [...new Set([...box.querySelectorAll(&#x27;[data-p]&#x27;)].map((e) =&gt; Number(e.dataset.p)))].sort((a, b) =&gt; b - a);
        for (const step of steps) {
            if (!overflow()) {
                break;
            }
            const items = [...box.querySelectorAll(`[data-p=&quot;${step}&quot;]`)].reverse();
            for (const item of items) {
                if (!overflow()) {
                    break;
                }
                item.classList.add(&#x27;hid&#x27;);
            }
        }
    }

    window.handleMessage = (data) =&gt; {
        state = typeof data === &#x27;string&#x27; ? JSON.parse(data) : data;
        render();
    };

    let armTimer = null;
    box.addEventListener(&#x27;click&#x27;, (event) =&gt; {
        const snapshotButton = event.target.closest(&#x27;[data-snapshot]&#x27;);
        if (snapshotButton) {
            if (!snapshotButton.classList.contains(&#x27;busy&#x27;)) {
                snapshotButton.classList.add(&#x27;busy&#x27;);
                snapshotButton.querySelector(&#x27;span&#x27;).textContent = T(&#x27;Creating snapshot...&#x27;);
                requestAction(&#x27;snapshot&#x27;, 1);
                setTimeout(render, 8000);
            }
            return;
        }
        const hookButton = event.target.closest(&#x27;[data-hook]&#x27;);
        if (hookButton) {
            if (!hookButton.classList.contains(&#x27;busy&#x27;)) {
                hookButton.classList.add(&#x27;busy&#x27;);
                requestAction(hookButton.dataset.hook, 1);
                setTimeout(() =&gt; hookButton.classList.remove(&#x27;busy&#x27;), 3000);
            }
            return;
        }
        const profileChip = event.target.closest(&#x27;[data-profile]&#x27;);
        if (profileChip &amp;&amp; !profileChip.disabled) {
            box.querySelectorAll(&#x27;[data-profile]&#x27;).forEach((c) =&gt; c.classList.toggle(&#x27;on&#x27;, c === profileChip));
            requestAction(&#x27;CurrentProfile&#x27;, profileChip.dataset.profile);
            return;
        }
        const toggle = event.target.closest(&#x27;.toggle&#x27;);
        if (toggle) {
            const armed = toggle.getAttribute(&#x27;aria-checked&#x27;) === &#x27;true&#x27;;
            // Scharf-/Unscharfschalten ist sicherheitsrelevant: einmal bestaetigen lassen.
            if (!toggle.classList.contains(&#x27;armed&#x27;)) {
                toggle.classList.add(&#x27;armed&#x27;);
                document.getElementById(&#x27;alarmState&#x27;).textContent = T(armed ? &#x27;Tap again to disarm&#x27; : &#x27;Tap again to arm&#x27;);
                fit();
                clearTimeout(armTimer);
                armTimer = setTimeout(render, 4000);
                return;
            }
            clearTimeout(armTimer);
            toggle.classList.remove(&#x27;armed&#x27;);
            toggle.setAttribute(&#x27;aria-checked&#x27;, String(!armed));
            document.getElementById(&#x27;alarmState&#x27;).textContent = T(armed ? &#x27;Disarming&#x27; : &#x27;Arming&#x27;);
            requestAction(&#x27;Armed&#x27;, !armed);
        }
    });

    window.addEventListener(&#x27;resize&#x27;, fit);
    if (document.fonts &amp;&amp; document.fonts.ready) {
        document.fonts.ready.then(fit);
    }
    // Laufzeiten (Events aktiv seit, Alarm scharf seit) laufen zwischen zwei Updates weiter.
    setInterval(() =&gt; {
        if (state &amp;&amp; (state.kind === &#x27;events&#x27; || state.kind === &#x27;alarm&#x27;)) {
            render();
        }
    }, 60000);
    render();
&lt;/script&gt;

&lt;style&gt;
    :root {
        /* --accent-color, --content-color und --card-color liefert das HTML-SDK. */
        --on-accent: #101114;

&lt;div id=&quot;t&quot;&gt;&lt;/div&gt;

&lt;script&gt;
    // Initialer Zustand der Instanz; danach pusht das Modul den kompletten Zustand als JSON.

    const padTop = px(&#x27;margintop&#x27;, 15), padSide = px(&#x27;marginside&#x27;, 15), padBottom = px(&#x27;marginbottom&#x27;, 15);

    if (padTop &gt;= 40) {

    // Namen kommen vom Controller (Geraetenamen etc.) und duerfen nie als Markup interpretiert werden.
    const E = (text) =&gt; String(text ?? &#x27;&#x27;).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, (c) =&gt; ({ &#x27;&amp;&#x27;: &#x27;&amp;amp;&#x27;, &#x27;&lt;&#x27;: &#x27;&amp;lt;&#x27;, &#x27;&gt;&#x27;: &#x27;&amp;gt;&#x27;, &#x27;&quot;&#x27;: &#x27;&amp;quot;&#x27;, &quot;&#x27;&quot;: &#x27;&amp;#39;&#x27; }[c]));
    const num = (value, digits = 0) =&gt; Number(value).toLocaleString(undefined, { minimumFractionDigits: digits, maximumFractionDigits: digits });
    const icon = (name) =&gt; `&lt;i class=&quot;fa-light fa-${name}&quot;&gt;&lt;/i&gt;`;
    const has = (value) =&gt; value !== undefined &amp;&amp; value !== null &amp;&amp; value !== &#x27;&#x27;;
    const clamp = (value) =&gt; Math.max(0, Math.min(100, Number(value) || 0));

        if (d &gt; 0) {

        }
        return h &gt; 0 ? `${h} ${T(&#x27;h&#x27;)} ${m} ${T(&#x27;min&#x27;)}` : `${m} ${T(&#x27;min&#x27;)}`;

    const since = (seconds) =&gt; T(&#x27;since %s&#x27;).replace(&#x27;%s&#x27;, duration(seconds));

    const head = (iconName, name, sub, status = &#x27;ok&#x27;) =&gt; `&lt;div class=&quot;head&quot;&gt;
        &lt;div class=&quot;ic&quot;&gt;${icon(iconName)}&lt;span class=&quot;dot ${status}&quot;&gt;&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;ht&quot;&gt;&lt;div class=&quot;name&quot;&gt;${E(name)}&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;span class=&quot;dot inline-dot ${status}&quot;&gt;&lt;/span&gt; ${E(sub)}&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;`;
    const kpis = (items) =&gt; `&lt;div class=&quot;kpis&quot;&gt;${items.map(([value, label, cls = &#x27;&#x27;]) =&gt; `&lt;div class=&quot;kpi ${cls}&quot;&gt;&lt;div class=&quot;v&quot;&gt;${value}&lt;/div&gt;&lt;div class=&quot;l&quot;&gt;${E(label)}&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`;
    const bar = (label, percent, text, cls) =&gt; `&lt;div class=&quot;barx&quot;&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;${E(label)}&lt;/span&gt;&lt;span&gt;${E(text ?? `${num(percent)} %`)}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;track&quot;&gt;&lt;i class=&quot;${cls ?? &#x27;&#x27;}&quot; style=&quot;width:${clamp(percent)}%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;/div&gt;`;

    }
    // Zeilen ohne Wert entfallen; die erste sichtbare Zeile hat keine Trennlinie.
    const rows = (items) =&gt; `&lt;div class=&quot;rows&quot;&gt;${items.filter((r) =&gt; has(r[1])).map(([key, value, p], i) =&gt; `&lt;div class=&quot;row ${i === 0 ? &#x27;first&#x27; : &#x27;&#x27;}&quot; ${p ? `data-p=&quot;${p}&quot;` : &#x27;&#x27;}&gt;&lt;span&gt;${E(key)}&lt;/span&gt;&lt;span&gt;${value}&lt;/span&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`;

    const connLabel = (s) =&gt; T({ CONNECTED: &#x27;Connected&#x27;, CONNECTING: &#x27;Connecting&#x27;, DISCONNECTED: &#x27;Disconnected&#x27; }[s] || (s || &#x27;Disconnected&#x27;));

    const deviceIcons = {
        &#x27;Camera&#x27;: &#x27;camera-cctv&#x27;, &#x27;UP-Sense&#x27;: &#x27;sensor&#x27;, &#x27;UP-AirQuality&#x27;: &#x27;wind&#x27;,
        &#x27;Chime&#x27;: &#x27;bell&#x27;, &#x27;Light&#x27;: &#x27;lightbulb&#x27;, &#x27;Speaker&#x27;: &#x27;speaker&#x27;, &#x27;Viewer&#x27;: &#x27;display&#x27;
    };

    function renderDevice(d) {
        const type = d.type || &#x27;Camera&#x27;;
        const sub = [d.model, connLabel(d.state)].filter(has).join(&#x27; · &#x27;);
        let body = &#x27;&#x27;;
        if (type === &#x27;Camera&#x27;) {
            const items = [];
            if (has(d.micVolume)) {
                items.push([`${num(d.micVolume)}&lt;small&gt; %&lt;/small&gt;`, T(&#x27;Microphone Volume&#x27;)]);
            }
            if (d.micEnabled !== undefined &amp;&amp; d.micEnabled !== null) {
                items.push([`&lt;span class=&quot;${d.micEnabled ? &#x27;txtok&#x27; : &#x27;&#x27;}&quot;&gt;${E(T(d.micEnabled ? &#x27;On&#x27; : &#x27;Off&#x27;))}&lt;/span&gt;`, T(&#x27;Microphone&#x27;), &#x27;wide-only&#x27;]);

            }
            body += rows([[T(&#x27;LCD Message&#x27;), has(d.lcdMessage) ? E(d.lcdMessage) : &#x27;&#x27;, 3]]);
            body += `&lt;div data-p=&quot;2&quot;&gt;&lt;button class=&quot;btn&quot; data-snapshot&gt;${icon(&#x27;camera-polaroid&#x27;)}&lt;span&gt;${E(T(&#x27;Create snapshot&#x27;))}&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;`;
        } else if (type === &#x27;Speaker&#x27;) {

            body += `&lt;div class=&quot;state&quot;&gt;&lt;span class=&quot;big ${[&#x27;streaming&#x27;, &#x27;playing&#x27;, &#x27;tts_playing&#x27;].includes(d.speakerStatus) ? &#x27;txtok&#x27; : &#x27;&#x27;}&quot;&gt;${E(T(statusLabels[d.speakerStatus] || d.speakerStatus || &#x27;Idle&#x27;))}&lt;/span&gt;&lt;/div&gt;`;

            }
            if (has(d.humidity)) {

            }
            if (climate.length) {

            }
            body += rows([
                [T(&#x27;Vape Index&#x27;), has(d.vape) ? num(d.vape) : &#x27;&#x27;, 3],
                [&#x27;TVOC&#x27;, has(d.tvoc) ? `${num(d.tvoc)} ppb` : &#x27;&#x27;, 4],
                [&#x27;VOC&#x27;, has(d.voc) ? num(d.voc) : &#x27;&#x27;, 5],
                [&#x27;PM1.0&#x27;, has(d.pm1) ? `${num(d.pm1, 1)} µg/m³` : &#x27;&#x27;, 5],
                [&#x27;PM4.0&#x27;, has(d.pm4) ? `${num(d.pm4, 1)} µg/m³` : &#x27;&#x27;, 6],

        } else {
            // Chime, Light, ...
            body += `&lt;div class=&quot;state&quot;&gt;&lt;span class=&quot;big ${connState(d.state) === &#x27;ok&#x27; ? &#x27;txtok&#x27; : &#x27;txterr&#x27;}&quot;&gt;${E(connLabel(d.state))}&lt;/span&gt;&lt;/div&gt;`;
        }
        return head(deviceIcons[type] || &#x27;circle-nodes&#x27;, d.name || type, sub, connState(d.state)) + body + &#x27;&lt;div class=&quot;foot&quot;&gt;&lt;/div&gt;&#x27;;
    }

    const eventLabels = {
        motion: &#x27;Motion&#x27;, smartDetectZone: &#x27;Smart Detection&#x27;, smartDetectLine: &#x27;Line crossing&#x27;,
        smartDetectLoiterZone: &#x27;Loitering&#x27;, smartAudioDetect: &#x27;Audio detection&#x27;, ring: &#x27;Ring&#x27;,
        sensorMotion: &#x27;Sensor motion&#x27;, sensorExtremeValues: &#x27;Extreme values&#x27;, sensorWaterLeak: &#x27;Water leak&#x27;,
        sensorTamper: &#x27;Tamper&#x27;, sensorBatteryLow: &#x27;Battery low&#x27;, sensorAlarm: &#x27;Alarm&#x27;,
        sensorOpened: &#x27;Opened&#x27;, sensorClosed: &#x27;Closed&#x27;, sensorSmokeTest: &#x27;Smoke test&#x27;, lightMotion: &#x27;Light motion&#x27;

    const eventLabel = (type) =&gt; T(eventLabels[type] || type);

        let body = kpis([[`&lt;span class=&quot;${active ? &#x27;txtwarn&#x27; : &#x27;&#x27;}&quot;&gt;${num(events.length)}&lt;/span&gt;`, T(&#x27;Active events&#x27;)]]);
        if (active) {
            const now = Date.now() / 1000;

    &lt;/div&gt;`;
    const kpis = (items) =&gt; `&lt;div class=&quot;kpis&quot;&gt;${items.map(([value, label, cls = &#x27;&#x27;]) =&gt; `&lt;div class=&quot;kpi ${cls}&quot;&gt;&lt;div class=&quot;v&quot;&gt;${value}&lt;/div&gt;&lt;div class=&quot;l&quot;&gt;${E(label)}&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`;
    const bar = (label, percent, text, cls) =&gt; `&lt;div class=&quot;barx&quot;&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;${E(label)}&lt;/span&gt;&lt;span&gt;${E(text ?? `${num(percent)} %`)}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;track&quot;&gt;&lt;i class=&quot;${cls ?? &#x27;&#x27;}&quot; style=&quot;width:${clamp(percent)}%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;/div&gt;`;
    function ring(label, text, percent, cls = &#x27;&#x27;) {
        const c = 2 * Math.PI * 26;
        return `&lt;div class=&quot;ring&quot;&gt;&lt;svg width=&quot;62&quot; height=&quot;62&quot;&gt;&lt;circle class=&quot;bg&quot; cx=&quot;31&quot; cy=&quot;31&quot; r=&quot;26&quot; fill=&quot;none&quot; stroke-width=&quot;5&quot;/&gt;&lt;circle class=&quot;fg ${cls}&quot; cx=&quot;31&quot; cy=&quot;31&quot; r=&quot;26&quot; fill=&quot;none&quot; stroke-width=&quot;5&quot; stroke-linecap=&quot;round&quot; stroke-dasharray=&quot;${c * clamp(percent) / 100} ${c}&quot;/&gt;&lt;/svg&gt;&lt;div&gt;${E(text)}&lt;small&gt;${E(label)}&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;`;
    }
    // Zeilen ohne Wert entfallen; die erste sichtbare Zeile hat keine Trennlinie.
    const rows = (items) =&gt; `&lt;div class=&quot;rows&quot;&gt;${items.filter((r) =&gt; has(r[1])).map(([key, value, p], i) =&gt; `&lt;div class=&quot;row ${i === 0 ? &#x27;first&#x27; : &#x27;&#x27;}&quot; ${p ? `data-p=&quot;${p}&quot;` : &#x27;&#x27;}&gt;&lt;span&gt;${E(key)}&lt;/span&gt;&lt;span&gt;${value}&lt;/span&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`;
    const onOff = (value) =&gt; (value === undefined || value === null ? &#x27;&#x27; : `&lt;span class=&quot;${value ? &#x27;txtok&#x27; : &#x27;&#x27;}&quot;&gt;${E(T(value ? &#x27;On&#x27; : &#x27;Off&#x27;))}&lt;/span&gt;`);

    // Verbindungsstatus der Protect-Geraete
    const connState = (s) =&gt; ({ CONNECTED: &#x27;ok&#x27;, CONNECTING: &#x27;warn&#x27; }[s] || &#x27;err&#x27;);
    const connLabel = (s) =&gt; T({ CONNECTED: &#x27;Connected&#x27;, CONNECTING: &#x27;Connecting&#x27;, DISCONNECTED: &#x27;Disconnected&#x27; }[s] || (s || &#x27;Disconnected&#x27;));

    const deviceIcons = {
        &#x27;Camera&#x27;: &#x27;camera-cctv&#x27;, &#x27;UP-Sense&#x27;: &#x27;sensor&#x27;, &#x27;UP-AirQuality&#x27;: &#x27;wind&#x27;,
        &#x27;Chime&#x27;: &#x27;bell&#x27;, &#x27;Light&#x27;: &#x27;lightbulb&#x27;, &#x27;Speaker&#x27;: &#x27;speaker&#x27;, &#x27;Viewer&#x27;: &#x27;display&#x27;
    };

    function renderDevice(d) {
        const type = d.type || &#x27;Camera&#x27;;
        const sub = [d.model, connLabel(d.state)].filter(has).join(&#x27; · &#x27;);
        let body = &#x27;&#x27;;
        if (type === &#x27;Camera&#x27;) {
            const items = [];
            if (has(d.micVolume)) {
                items.push([`${num(d.micVolume)}&lt;small&gt; %&lt;/small&gt;`, T(&#x27;Microphone Volume&#x27;)]);
            }
            if (d.micEnabled !== undefined &amp;&amp; d.micEnabled !== null) {
                items.push([`&lt;span class=&quot;${d.micEnabled ? &#x27;txtok&#x27; : &#x27;&#x27;}&quot;&gt;${E(T(d.micEnabled ? &#x27;On&#x27; : &#x27;Off&#x27;))}&lt;/span&gt;`, T(&#x27;Microphone&#x27;), &#x27;wide-only&#x27;]);
            }
            if (items.length) {
                body += kpis(items);
            }
            body += rows([[T(&#x27;LCD Message&#x27;), has(d.lcdMessage) ? E(d.lcdMessage) : &#x27;&#x27;, 3]]);
            body += `&lt;div data-p=&quot;2&quot;&gt;&lt;button class=&quot;btn&quot; data-snapshot&gt;${icon(&#x27;camera-polaroid&#x27;)}&lt;span&gt;${E(T(&#x27;Create snapshot&#x27;))}&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;`;
        } else if (type === &#x27;Speaker&#x27;) {
            const statusLabels = { idle: &#x27;Idle&#x27;, streaming: &#x27;Streaming&#x27;, playing: &#x27;Playing&#x27;, tts_playing: &#x27;TTS Playing&#x27;, uploading: &#x27;Uploading&#x27; };
            body += `&lt;div class=&quot;state&quot;&gt;&lt;span class=&quot;big ${[&#x27;streaming&#x27;, &#x27;playing&#x27;, &#x27;tts_playing&#x27;].includes(d.speakerStatus) ? &#x27;txtok&#x27; : &#x27;&#x27;}&quot;&gt;${E(T(statusLabels[d.speakerStatus] || d.speakerStatus || &#x27;Idle&#x27;))}&lt;/span&gt;&lt;/div&gt;`;
            const items = [];
            if (has(d.volume)) {
                items.push([`${num(d.volume)}&lt;small&gt; %&lt;/small&gt;`, T(&#x27;Volume&#x27;)]);
            }
            if (has(d.micVolume)) {
                items.push([`${num(d.micVolume)}&lt;small&gt; %&lt;/small&gt;`, T(&#x27;Microphone Volume&#x27;), &#x27;wide-only&#x27;]);
            }
            if (items.length) {
                body += `&lt;div data-p=&quot;2&quot;&gt;${kpis(items)}&lt;/div&gt;`;
            }
            body += rows([
                [T(&#x27;Microphone&#x27;), onOff(d.micEnabled), 3],
                [T(&#x27;Speaker Mode&#x27;), has(d.speakerMode) ? E(T(d.speakerMode === &#x27;talk&#x27; ? &#x27;Talk&#x27; : &#x27;Listen&#x27;)) : &#x27;&#x27;, 4]
            ]);
        } else if (type === &#x27;UP-Sense&#x27;) {
            const items = [];
            if (has(d.temperature)) {
                items.push([`${num(d.temperature, 1)}&lt;small&gt; °C&lt;/small&gt;`, T(&#x27;Temperature&#x27;)]);
            }
            if (has(d.humidity)) {
                items.push([`${num(d.humidity)}&lt;small&gt; %&lt;/small&gt;`, T(&#x27;Humidity&#x27;)]);
            }
            if (has(d.illuminance)) {
                items.push([`${num(d.illuminance)}&lt;small&gt; lx&lt;/small&gt;`, T(&#x27;Illuminance&#x27;), &#x27;wide-only&#x27;]);
            }
            if (items.length) {
                body += kpis(items);
            }
            if (has(d.battery)) {
                body += bar(T(&#x27;Battery&#x27;), d.battery, `${num(d.battery)} %`, d.battery &lt;= 15 ? &#x27;err&#x27; : (d.battery &lt;= 30 ? &#x27;warn&#x27; : &#x27;&#x27;));
            }
        } else if (type === &#x27;UP-AirQuality&#x27;) {
            const aqiCls = d.aqi &gt;= 150 ? &#x27;err&#x27; : (d.aqi &gt;= 100 ? &#x27;warn&#x27; : &#x27;&#x27;);
            const items = [];
            if (has(d.co2)) {
                items.push([`${num(d.co2)}&lt;small&gt; ppm&lt;/small&gt;`, &#x27;CO2&#x27;]);
            }
            if (has(d.pm25)) {
                items.push([`${num(d.pm25, 1)}&lt;small&gt; µg/m³&lt;/small&gt;`, &#x27;PM2.5&#x27;]);
            }
            if (has(d.aqi)) {
                body += `&lt;div class=&quot;rings&quot;&gt;${ring(T(&#x27;Air Quality Index&#x27;), num(d.aqi), d.aqi / 500 * 100, aqiCls)}${items.length ? kpis(items) : &#x27;&#x27;}&lt;/div&gt;`;
            } else if (items.length) {
                body += kpis(items);
            }
            const climate = [];
            if (has(d.temperature)) {
                climate.push([`${num(d.temperature, 1)}&lt;small&gt; °C&lt;/small&gt;`, T(&#x27;Temperature&#x27;)]);
            }
            if (has(d.humidity)) {
                climate.push([`${num(d.humidity)}&lt;small&gt; %&lt;/small&gt;`, T(&#x27;Humidity&#x27;)]);
            }
            if (climate.length) {
                body += `&lt;div data-p=&quot;2&quot;&gt;${kpis(climate)}&lt;/div&gt;`;
            }
            body += rows([
                [T(&#x27;Vape Index&#x27;), has(d.vape) ? num(d.vape) : &#x27;&#x27;, 3],
                [&#x27;TVOC&#x27;, has(d.tvoc) ? `${num(d.tvoc)} ppb` : &#x27;&#x27;, 4],
                [&#x27;VOC&#x27;, has(d.voc) ? num(d.voc) : &#x27;&#x27;, 5],
                [&#x27;PM1.0&#x27;, has(d.pm1) ? `${num(d.pm1, 1)} µg/m³` : &#x27;&#x27;, 5],
                [&#x27;PM4.0&#x27;, has(d.pm4) ? `${num(d.pm4, 1)} µg/m³` : &#x27;&#x27;, 6],
                [&#x27;PM10&#x27;, has(d.pm10) ? `${num(d.pm10, 1)} µg/m³` : &#x27;&#x27;, 6]
            ]);
        } else {
            // Chime, Light, ...
            body += `&lt;div class=&quot;state&quot;&gt;&lt;span class=&quot;big ${connState(d.state) === &#x27;ok&#x27; ? &#x27;txtok&#x27; : &#x27;txterr&#x27;}&quot;&gt;${E(connLabel(d.state))}&lt;/span&gt;&lt;/div&gt;`;
        }
        return head(deviceIcons[type] || &#x27;circle-nodes&#x27;, d.name || type, sub, connState(d.state)) + body + &#x27;&lt;div class=&quot;foot&quot;&gt;&lt;/div&gt;&#x27;;
    }

    const eventLabels = {
        motion: &#x27;Motion&#x27;, smartDetectZone: &#x27;Smart Detection&#x27;, smartDetectLine: &#x27;Line crossing&#x27;,
        smartDetectLoiterZone: &#x27;Loitering&#x27;, smartAudioDetect: &#x27;Audio detection&#x27;, ring: &#x27;Ring&#x27;,
        sensorMotion: &#x27;Sensor motion&#x27;, sensorExtremeValues: &#x27;Extreme values&#x27;, sensorWaterLeak: &#x27;Water leak&#x27;,
        sensorTamper: &#x27;Tamper&#x27;, sensorBatteryLow: &#x27;Battery low&#x27;, sensorAlarm: &#x27;Alarm&#x27;,
        sensorOpened: &#x27;Opened&#x27;, sensorClosed: &#x27;Closed&#x27;, sensorSmokeTest: &#x27;Smoke test&#x27;, lightMotion: &#x27;Light motion&#x27;
    };
    const eventLabel = (type) =&gt; T(eventLabels[type] || type);

    function renderEvents(s) {
        const events = s.events || [];
        const active = events.length &gt; 0;
        const sub = active ? `${num(events.length)} ${T(events.length === 1 ? &#x27;active event&#x27; : &#x27;active events&#x27;)}` : T(&#x27;No active events&#x27;);
        let body = kpis([[`&lt;span class=&quot;${active ? &#x27;txtwarn&#x27; : &#x27;&#x27;}&quot;&gt;${num(events.length)}&lt;/span&gt;`, T(&#x27;Active events&#x27;)]]);
        if (active) {
            const now = Date.now() / 1000;
            body += `&lt;div class=&quot;evs&quot; data-p=&quot;2&quot;&gt;${events.slice(0, 8).map((ev, i) =&gt; `&lt;div class=&quot;ev ${i === 0 ? &#x27;first&#x27; : &#x27;&#x27;}&quot;&gt;
                &lt;span class=&quot;dot warn&quot;&gt;&lt;/span&gt;
                &lt;div class=&quot;d&quot;&gt;&lt;div&gt;${E(eventLabel(ev.type))}&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;${E(ev.device || &#x27;&#x27;)}&lt;/div&gt;&lt;/div&gt;
                ${ev.start &gt; 0 ? `&lt;span class=&quot;rt&quot;&gt;${E(since(now - ev.start))}&lt;/span&gt;` : &#x27;&#x27;}&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`;
        }
        const globals = (s.globals || []);
        if (globals.length) {
            body += `&lt;div class=&quot;chips wide-only&quot; data-p=&quot;3&quot;&gt;${globals.map((g) =&gt; `&lt;span class=&quot;chip ${g.active ? &#x27;warn&#x27; : &#x27;&#x27;}&quot;&gt;${E(eventLabel(g.type))}&lt;/span&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`;
        }
        return head(&#x27;sensor&#x27;, s.name || &#x27;UniFi Protect&#x27;, sub, active ? &#x27;warn&#x27; : &#x27;ok&#x27;) + body + &#x27;&lt;div class=&quot;foot&quot;&gt;&lt;/div&gt;&#x27;;
    }

    function renderAlarm(a) {
        const status = String(a.status || &#x27;&#x27;).toLowerCase();
        const statusMap = {
            disabled: [&#x27;Disarmed&#x27;, &#x27;&#x27;, &#x27;err&#x27;],
            arming: [&#x27;Arming&#x27;, &#x27;txtwarn&#x27;, &#x27;warn&#x27;],
            armed: [&#x27;Armed&#x27;, &#x27;txtok&#x27;, &#x27;ok&#x27;],
            disarming: [&#x27;Disarming&#x27;, &#x27;txtwarn&#x27;, &#x27;warn&#x27;],
            breach: [&#x27;Breach&#x27;, &#x27;txterr&#x27;, &#x27;err&#x27;]
        };
        const [label, cls, dot] = statusMap[status] || [a.status || &#x27;—&#x27;, &#x27;&#x27;, &#x27;err&#x27;];
        const armed = a.armed === true;
        let body = `&lt;div class=&quot;state&quot;&gt;&lt;div&gt;&lt;span class=&quot;big ${cls}&quot; id=&quot;alarmState&quot;&gt;${E(T(label))}&lt;/span&gt;
            ${a.armedAt &gt; 0 &amp;&amp; armed ? `&lt;div class=&quot;sub&quot;&gt;${E(since(Date.now() / 1000 - a.armedAt))}&lt;/div&gt;` : &#x27;&#x27;}&lt;/div&gt;
            &lt;button class=&quot;toggle&quot; role=&quot;switch&quot; aria-checked=&quot;${armed}&quot; aria-label=&quot;Alarm&quot;&gt;&lt;/button&gt;&lt;/div&gt;`;
        if (a.breach) {
            body += `&lt;div class=&quot;state&quot;&gt;&lt;span class=&quot;txterr&quot;&gt;${icon(&#x27;triangle-exclamation&#x27;)} ${E(T(&#x27;Breach detected&#x27;))}&lt;/span&gt;&lt;/div&gt;`;
        }
        const profiles = a.profiles || [];
        if (profiles.length) {
            // Profilwechsel nur im unscharfen Zustand anbieten
            body += `&lt;div class=&quot;chips&quot; data-p=&quot;2&quot;&gt;${profiles.map((p) =&gt; `&lt;button class=&quot;chip ${p.id === a.currentProfile ? &#x27;on&#x27; : &#x27;&#x27;}&quot; data-profile=&quot;${E(p.id)}&quot; ${armed ? &#x27;disabled&#x27; : &#x27;&#x27;}&gt;${E(p.name)}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`;
        }
        body += rows([[T(&#x27;Active Profile&#x27;), has(a.profile) ? E(a.profile) : &#x27;&#x27;, 3]]);
        return head(&#x27;shield-halved&#x27;, a.name || &#x27;Alarm&#x27;, [T(&#x27;Alarm Profile&#x27;), has(a.profile) ? a.profile : &#x27;&#x27;].filter(has).join(&#x27;: &#x27;), dot) + body + &#x27;&lt;div class=&quot;foot&quot;&gt;&lt;/div&gt;&#x27;;
    }

    function renderWebhooks(w) {
        const hooks = w.hooks || [];
        const sub = `${num(hooks.length)} ${T(hooks.length === 1 ? &#x27;webhook&#x27; : &#x27;webhooks&#x27;)}`;
        let body;
        if (hooks.length) {
            body = `&lt;div class=&quot;hooks&quot;&gt;${hooks.map((h) =&gt; `&lt;button class=&quot;btn&quot; data-hook=&quot;${E(h.ident)}&quot;&gt;${icon(&#x27;bell-ring&#x27;)}&lt;span&gt;${E(h.name)}&lt;/span&gt;&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`;
        } else {
            body = `&lt;div class=&quot;empty&quot;&gt;${E(T(&#x27;No webhooks configured&#x27;))}&lt;/div&gt;`;
        }
        return head(&#x27;bell-ring&#x27;, w.name || &#x27;Webhooks&#x27;, sub, hooks.length ? &#x27;ok&#x27; : &#x27;warn&#x27;) + body + &#x27;&lt;div class=&quot;foot&quot;&gt;&lt;/div&gt;&#x27;;
    }

    const renderers = { device: renderDevice, events: renderEvents, alarm: renderAlarm, webhooks: renderWebhooks };

    function render() {
        if (!state || !state.kind || !renderers[state.kind]) {
            return;
        }
        if (state.inactive) {
            box.innerHTML = `&lt;div class=&quot;empty&quot;&gt;${E(T(&#x27;Instance inactive&#x27;))}&lt;/div&gt;`;
            return;
        }
        if (state.kind === &#x27;device&#x27; &amp;&amp; !state.name &amp;&amp; !state.model) {
            box.innerHTML = `&lt;div class=&quot;empty&quot;&gt;${E(T(&#x27;No data yet&#x27;))}&lt;/div&gt;`;
            return;
        }
        box.innerHTML = renderers[state.kind](state);
        box.classList.toggle(&#x27;off&#x27;, state.kind === &#x27;device&#x27; &amp;&amp; connState(state.state) === &#x27;err&#x27;);
        fit();
    }

    // Passt den Inhalt in die Kachel ein: erst die Groessenklassen, dann wird alles,
    // was mit data-p markiert ist, ausgeblendet (hoechste Zahl zuerst), bis nichts mehr ueberlaeuft.
    function fit() {
        const width = box.clientWidth - padSide * 2, height = box.clientHeight - padTop - padBottom;
        document.body.classList.toggle(&#x27;narrow&#x27;, width &lt; 200);
        document.body.classList.toggle(&#x27;short&#x27;, height &lt; 200);
        box.querySelectorAll(&#x27;.hid&#x27;).forEach((e) =&gt; e.classList.remove(&#x27;hid&#x27;));
        const overflow = () =&gt; box.scrollHeight &gt; box.clientHeight + 1;
        const steps = [...new Set([...box.querySelectorAll(&#x27;[data-p]&#x27;)].map((e) =&gt; Number(e.dataset.p)))].sort((a, b) =&gt; b - a);
        for (const step of steps) {
            if (!overflow()) {
                break;
            }
            const items = [...box.querySelectorAll(`[data-p=&quot;${step}&quot;]`)].reverse();
            for (const item of items) {
                if (!overflow()) {
                    break;
                }
                item.classList.add(&#x27;hid&#x27;);
            }
        }
    }

    window.handleMessage = (data) =&gt; {
        state = typeof data === &#x27;string&#x27; ? JSON.parse(data) : data;
        render();
    };

    let armTimer = null;
    box.addEventListener(&#x27;click&#x27;, (event) =&gt; {
        const snapshotButton = event.target.closest(&#x27;[data-snapshot]&#x27;);
        if (snapshotButton) {
            if (!snapshotButton.classList.contains(&#x27;busy&#x27;)) {
                snapshotButton.classList.add(&#x27;busy&#x27;);
                snapshotButton.querySelector(&#x27;span&#x27;).textContent = T(&#x27;Creating snapshot...&#x27;);
                requestAction(&#x27;snapshot&#x27;, 1);
                setTimeout(render, 8000);
            }
            return;
        }
        const hookButton = event.target.closest(&#x27;[data-hook]&#x27;);
        if (hookButton) {
            if (!hookButton.classList.contains(&#x27;busy&#x27;)) {
                hookButton.classList.add(&#x27;busy&#x27;);
                requestAction(hookButton.dataset.hook, 1);
                setTimeout(() =&gt; hookButton.classList.remove(&#x27;busy&#x27;), 3000);
            }
            return;
        }
        const profileChip = event.target.closest(&#x27;[data-profile]&#x27;);
        if (profileChip &amp;&amp; !profileChip.disabled) {
            box.querySelectorAll(&#x27;[data-profile]&#x27;).forEach((c) =&gt; c.classList.toggle(&#x27;on&#x27;, c === profileChip));
            requestAction(&#x27;CurrentProfile&#x27;, profileChip.dataset.profile);
            return;
        }
        const toggle = event.target.closest(&#x27;.toggle&#x27;);
        if (toggle) {
            const armed = toggle.getAttribute(&#x27;aria-checked&#x27;) === &#x27;true&#x27;;
            // Scharf-/Unscharfschalten ist sicherheitsrelevant: einmal bestaetigen lassen.
            if (!toggle.classList.contains(&#x27;armed&#x27;)) {
                toggle.classList.add(&#x27;armed&#x27;);
                document.getElementById(&#x27;alarmState&#x27;).textContent = T(armed ? &#x27;Tap again to disarm&#x27; : &#x27;Tap again to arm&#x27;);
                fit();
                clearTimeout(armTimer);
                armTimer = setTimeout(render, 4000);
                return;
            }
            clearTimeout(armTimer);
            toggle.classList.remove(&#x27;armed&#x27;);
            toggle.setAttribute(&#x27;aria-checked&#x27;, String(!armed));
            document.getElementById(&#x27;alarmState&#x27;).textContent = T(armed ? &#x27;Disarming&#x27; : &#x27;Arming&#x27;);
            requestAction(&#x27;Armed&#x27;, !armed);
        }
    });

    window.addEventListener(&#x27;resize&#x27;, fit);
    if (document.fonts &amp;&amp; document.fonts.ready) {
        document.fonts.ready.then(fit);
    }
    // Laufzeiten (Events aktiv seit, Alarm scharf seit) laufen zwischen zwei Updates weiter.
    setInterval(() =&gt; {
        if (state &amp;&amp; (state.kind === &#x27;events&#x27; || state.kind === &#x27;alarm&#x27;)) {
            render();
        }
    }, 60000);
    render();
&lt;/script&gt;

    :root {

    // Namen kommen vom Controller (Geraetenamen etc.) und duerfen nie als Markup interpretiert werden.

    const num = (value, digits = 0) =&gt; Number(value).toLocaleString(undefined, { minimumFractionDigits: digits, maximumFractionDigits: digits });

        &#x27;Chime&#x27;: &#x27;bell&#x27;, &#x27;Light&#x27;: &#x27;lightbulb&#x27;, &#x27;Speaker&#x27;: &#x27;speaker&#x27;, &#x27;Viewer&#x27;: &#x27;display&#x27;
    };

        const sub = [d.model, connLabel(d.state)].filter(has).join(&#x27; · &#x27;);
        let body = &#x27;&#x27;;
        if (type === &#x27;Camera&#x27;) {
            const items = [];
            if (has(d.micVolume)) {

                [&#x27;PM4.0&#x27;, has(d.pm4) ? `${num(d.pm4, 1)} µg/m³` : &#x27;&#x27;, 6],

    }

    const eventLabels = {

        smartDetectLoiterZone: &#x27;Loitering&#x27;, smartAudioDetect: &#x27;Audio detection&#x27;, ring: &#x27;Ring&#x27;,

        sensorTamper: &#x27;Tamper&#x27;, sensorBatteryLow: &#x27;Battery low&#x27;, sensorAlarm: &#x27;Alarm&#x27;,

        if (active) {

        &lt;div class=&quot;ht&quot;&gt;&lt;div class=&quot;name&quot;&gt;${E(name)}&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&lt;span class=&quot;dot inline-dot ${status}&quot;&gt;&lt;/span&gt; ${E(sub)}&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;`;
    const kpis = (items) =&gt; `&lt;div class=&quot;kpis&quot;&gt;${items.map(([value, label, cls = &#x27;&#x27;]) =&gt; `&lt;div class=&quot;kpi ${cls}&quot;&gt;&lt;div class=&quot;v&quot;&gt;${value}&lt;/div&gt;&lt;div class=&quot;l&quot;&gt;${E(label)}&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`;
    const bar = (label, percent, text, cls) =&gt; `&lt;div class=&quot;barx&quot;&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;${E(label)}&lt;/span&gt;&lt;span&gt;${E(text ?? `${num(percent)} %`)}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;track&quot;&gt;&lt;i class=&quot;${cls ?? &#x27;&#x27;}&quot; style=&quot;width:${clamp(percent)}%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;/div&gt;`;
    function ring(label, text, percent, cls = &#x27;&#x27;) {
        const c = 2 * Math.PI * 26;
        return `&lt;div class=&quot;ring&quot;&gt;&lt;svg width=&quot;62&quot; height=&quot;62&quot;&gt;&lt;circle class=&quot;bg&quot; cx=&quot;31&quot; cy=&quot;31&quot; r=&quot;26&quot; fill=&quot;none&quot; stroke-width=&quot;5&quot;/&gt;&lt;circle class=&quot;fg ${cls}&quot; cx=&quot;31&quot; cy=&quot;31&quot; r=&quot;26&quot; fill=&quot;none&quot; stroke-width=&quot;5&quot; stroke-linecap=&quot;round&quot; stroke-dasharray=&quot;${c * clamp(percent) / 100} ${c}&quot;/&gt;&lt;/svg&gt;&lt;div&gt;${E(text)}&lt;small&gt;${E(label)}&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;`;
    }
    // Zeilen ohne Wert entfallen; die erste sichtbare Zeile hat keine Trennlinie.
    const rows = (items) =&gt; `&lt;div class=&quot;rows&quot;&gt;${items.filter((r) =&gt; has(r[1])).map(([key, value, p], i) =&gt; `&lt;div class=&quot;row ${i === 0 ? &#x27;first&#x27; : &#x27;&#x27;}&quot; ${p ? `data-p=&quot;${p}&quot;` : &#x27;&#x27;}&gt;&lt;span&gt;${E(key)}&lt;/span&gt;&lt;span&gt;${value}&lt;/span&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`;
    const onOff = (value) =&gt; (value === undefined || value === null ? &#x27;&#x27; : `&lt;span class=&quot;${value ? &#x27;txtok&#x27; : &#x27;&#x27;}&quot;&gt;${E(T(value ? &#x27;On&#x27; : &#x27;Off&#x27;))}&lt;/span&gt;`);

    // Verbindungsstatus der Protect-Geraete
    const connState = (s) =&gt; ({ CONNECTED: &#x27;ok&#x27;, CONNECTING: &#x27;warn&#x27; }[s] || &#x27;err&#x27;);
    const connLabel = (s) =&gt; T({ CONNECTED: &#x27;Connected&#x27;, CONNECTING: &#x27;Connecting&#x27;, DISCONNECTED: &#x27;Disconnected&#x27; }[s] || (s || &#x27;Disconnected&#x27;));

    const deviceIcons = {
        &#x27;Camera&#x27;: &#x27;camera-cctv&#x27;, &#x27;UP-Sense&#x27;: &#x27;sensor&#x27;, &#x27;UP-AirQuality&#x27;: &#x27;wind&#x27;,
        &#x27;Chime&#x27;: &#x27;bell&#x27;, &#x27;Light&#x27;: &#x27;lightbulb&#x27;, &#x27;Speaker&#x27;: &#x27;speaker&#x27;, &#x27;Viewer&#x27;: &#x27;display&#x27;
    };

    function renderDevice(d) {
        const type = d.type || &#x27;Camera&#x27;;
        const sub = [d.model, connLabel(d.state)].filter(has).join(&#x27; · &#x27;);
        let body = &#x27;&#x27;;
        if (type === &#x27;Camera&#x27;) {
            const items = [];
            if (has(d.micVolume)) {
                items.push([`${num(d.micVolume)}&lt;small&gt; %&lt;/small&gt;`, T(&#x27;Microphone Volume&#x27;)]);
            }
            if (d.micEnabled !== undefined &amp;&amp; d.micEnabled !== null) {
                items.push([`&lt;span class=&quot;${d.micEnabled ? &#x27;txtok&#x27; : &#x27;&#x27;}&quot;&gt;${E(T(d.micEnabled ? &#x27;On&#x27; : &#x27;Off&#x27;))}&lt;/span&gt;`, T(&#x27;Microphone&#x27;), &#x27;wide-only&#x27;]);
            }
            if (items.length) {
                body += kpis(items);
            }
            body += rows([[T(&#x27;LCD Message&#x27;), has(d.lcdMessage) ? E(d.lcdMessage) : &#x27;&#x27;, 3]]);
            body += `&lt;div data-p=&quot;2&quot;&gt;&lt;button class=&quot;btn&quot; data-snapshot&gt;${icon(&#x27;camera-polaroid&#x27;)}&lt;span&gt;${E(T(&#x27;Create snapshot&#x27;))}&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;`;
        } else if (type === &#x27;Speaker&#x27;) {
            const statusLabels = { idle: &#x27;Idle&#x27;, streaming: &#x27;Streaming&#x27;, playing: &#x27;Playing&#x27;, tts_playing: &#x27;TTS Playing&#x27;, uploading: &#x27;Uploading&#x27; };
            body += `&lt;div class=&quot;state&quot;&gt;&lt;span class=&quot;big ${[&#x27;streaming&#x27;, &#x27;playing&#x27;, &#x27;tts_playing&#x27;].includes(d.speakerStatus) ? &#x27;txtok&#x27; : &#x27;&#x27;}&quot;&gt;${E(T(statusLabels[d.speakerStatus] || d.speakerStatus || &#x27;Idle&#x27;))}&lt;/span&gt;&lt;/div&gt;`;
            const items = [];
            if (has(d.volume)) {
                items.push([`${num(d.volume)}&lt;small&gt; %&lt;/small&gt;`, T(&#x27;Volume&#x27;)]);
            }
            if (has(d.micVolume)) {
                items.push([`${num(d.micVolume)}&lt;small&gt; %&lt;/small&gt;`, T(&#x27;Microphone Volume&#x27;), &#x27;wide-only&#x27;]);
            }
            if (items.length) {
                body += `&lt;div data-p=&quot;2&quot;&gt;${kpis(items)}&lt;/div&gt;`;
            }
            body += rows([
                [T(&#x27;Microphone&#x27;), onOff(d.micEnabled), 3],
                [T(&#x27;Speaker Mode&#x27;), has(d.speakerMode) ? E(T(d.speakerMode === &#x27;talk&#x27; ? &#x27;Talk&#x27; : &#x27;Listen&#x27;)) : &#x27;&#x27;, 4]
            ]);
        } else if (type === &#x27;UP-Sense&#x27;) {
            const items = [];
            if (has(d.temperature)) {
                items.push([`${num(d.temperature, 1)}&lt;small&gt; °C&lt;/small&gt;`, T(&#x27;Temperature&#x27;)]);
            }
            if (has(d.humidity)) {
                items.push([`${num(d.humidity)}&lt;small&gt; %&lt;/small&gt;`, T(&#x27;Humidity&#x27;)]);
            }
            if (has(d.illuminance)) {
                items.push([`${num(d.illuminance)}&lt;small&gt; lx&lt;/small&gt;`, T(&#x27;Illuminance&#x27;), &#x27;wide-only&#x27;]);
            }
            if (items.length) {
                body += kpis(items);
            }
            if (has(d.battery)) {
                body += bar(T(&#x27;Battery&#x27;), d.battery, `${num(d.battery)} %`, d.battery &lt;= 15 ? &#x27;err&#x27; : (d.battery &lt;= 30 ? &#x27;warn&#x27; : &#x27;&#x27;));
            }
        } else if (type === &#x27;UP-AirQuality&#x27;) {
            const aqiCls = d.aqi &gt;= 150 ? &#x27;err&#x27; : (d.aqi &gt;= 100 ? &#x27;warn&#x27; : &#x27;&#x27;);
            const items = [];
            if (has(d.co2)) {
                items.push([`${num(d.co2)}&lt;small&gt; ppm&lt;/small&gt;`, &#x27;CO2&#x27;]);
            }
            if (has(d.pm25)) {
                items.push([`${num(d.pm25, 1)}&lt;small&gt; µg/m³&lt;/small&gt;`, &#x27;PM2.5&#x27;]);
            }
            if (has(d.aqi)) {
                body += `&lt;div class=&quot;rings&quot;&gt;${ring(T(&#x27;Air Quality Index&#x27;), num(d.aqi), d.aqi / 500 * 100, aqiCls)}${items.length ? kpis(items) : &#x27;&#x27;}&lt;/div&gt;`;
            } else if (items.length) {
                body += kpis(items);
            }
            const climate = [];
            if (has(d.temperature)) {
                climate.push([`${num(d.temperature, 1)}&lt;small&gt; °C&lt;/small&gt;`, T(&#x27;Temperature&#x27;)]);
            }
            if (has(d.humidity)) {
                climate.push([`${num(d.humidity)}&lt;small&gt; %&lt;/small&gt;`, T(&#x27;Humidity&#x27;)]);
            }
            if (climate.length) {
                body += `&lt;div data-p=&quot;2&quot;&gt;${kpis(climate)}&lt;/div&gt;`;
            }
            body += rows([
                [T(&#x27;Vape Index&#x27;), has(d.vape) ? num(d.vape) : &#x27;&#x27;, 3],
                [&#x27;TVOC&#x27;, has(d.tvoc) ? `${num(d.tvoc)} ppb` : &#x27;&#x27;, 4],
                [&#x27;VOC&#x27;, has(d.voc) ? num(d.voc) : &#x27;&#x27;, 5],
                [&#x27;PM1.0&#x27;, has(d.pm1) ? `${num(d.pm1, 1)} µg/m³` : &#x27;&#x27;, 5],
                [&#x27;PM4.0&#x27;, has(d.pm4) ? `${num(d.pm4, 1)} µg/m³` : &#x27;&#x27;, 6],
                [&#x27;PM10&#x27;, has(d.pm10) ? `${num(d.pm10, 1)} µg/m³` : &#x27;&#x27;, 6]
            ]);
        } else {
            // Chime, Light, ...
            body += `&lt;div class=&quot;state&quot;&gt;&lt;span class=&quot;big ${connState(d.state) === &#x27;ok&#x27; ? &#x27;txtok&#x27; : &#x27;txterr&#x27;}&quot;&gt;${E(connLabel(d.state))}&lt;/span&gt;&lt;/div&gt;`;
        }
        return head(deviceIcons[type] || &#x27;circle-nodes&#x27;, d.name || type, sub, connState(d.state)) + body + &#x27;&lt;div class=&quot;foot&quot;&gt;&lt;/div&gt;&#x27;;
    }

    const eventLabels = {
        motion: &#x27;Motion&#x27;, smartDetectZone: &#x27;Smart Detection&#x27;, smartDetectLine: &#x27;Line crossing&#x27;,
        smartDetectLoiterZone: &#x27;Loitering&#x27;, smartAudioDetect: &#x27;Audio detection&#x27;, ring: &#x27;Ring&#x27;,
        sensorMotion: &#x27;Sensor motion&#x27;, sensorExtremeValues: &#x27;Extreme values&#x27;, sensorWaterLeak: &#x27;Water leak&#x27;,
        sensorTamper: &#x27;Tamper&#x27;, sensorBatteryLow: &#x27;Battery low&#x27;, sensorAlarm: &#x27;Alarm&#x27;,
        sensorOpened: &#x27;Opened&#x27;, sensorClosed: &#x27;Closed&#x27;, sensorSmokeTest: &#x27;Smoke test&#x27;, lightMotion: &#x27;Light motion&#x27;
    };
    const eventLabel = (type) =&gt; T(eventLabels[type] || type);

    function renderEvents(s) {
        const events = s.events || [];
        const active = events.length &gt; 0;
        const sub = active ? `${num(events.length)} ${T(events.length === 1 ? &#x27;active event&#x27; : &#x27;active events&#x27;)}` : T(&#x27;No active events&#x27;);
        let body = kpis([[`&lt;span class=&quot;${active ? &#x27;txtwarn&#x27; : &#x27;&#x27;}&quot;&gt;${num(events.length)}&lt;/span&gt;`, T(&#x27;Active events&#x27;)]]);
        if (active) {
            const now = Date.now() / 1000;
            body += `&lt;div class=&quot;evs&quot; data-p=&quot;2&quot;&gt;${events.slice(0, 8).map((ev, i) =&gt; `&lt;div class=&quot;ev ${i === 0 ? &#x27;first&#x27; : &#x27;&#x27;}&quot;&gt;
                &lt;span class=&quot;dot warn&quot;&gt;&lt;/span&gt;
                &lt;div class=&quot;d&quot;&gt;&lt;div&gt;${E(eventLabel(ev.type))}&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;${E(ev.device || &#x27;&#x27;)}&lt;/div&gt;&lt;/div&gt;
                ${ev.start &gt; 0 ? `&lt;span class=&quot;rt&quot;&gt;${E(since(now - ev.start))}&lt;/span&gt;` : &#x27;&#x27;}&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`;
        }
        const globals = (s.globals || []);
        if (globals.length) {
            body += `&lt;div class=&quot;chips wide-only&quot; data-p=&quot;3&quot;&gt;${globals.map((g) =&gt; `&lt;span class=&quot;chip ${g.active ? &#x27;warn&#x27; : &#x27;&#x27;}&quot;&gt;${E(eventLabel(g.type))}&lt;/span&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`;
        }
        return head(&#x27;sensor&#x27;, s.name || &#x27;UniFi Protect&#x27;, sub, active ? &#x27;warn&#x27; : &#x27;ok&#x27;) + body + &#x27;&lt;div class=&quot;foot&quot;&gt;&lt;/div&gt;&#x27;;
    }

    function renderAlarm(a) {
        const status = String(a.status || &#x27;&#x27;).toLowerCase();
        const statusMap = {
            disabled: [&#x27;Disarmed&#x27;, &#x27;&#x27;, &#x27;err&#x27;],
            arming: [&#x27;Arming&#x27;, &#x27;txtwarn&#x27;, &#x27;warn&#x27;],
            armed: [&#x27;Armed&#x27;, &#x27;txtok&#x27;, &#x27;ok&#x27;],
            disarming: [&#x27;Disarming&#x27;, &#x27;txtwarn&#x27;, &#x27;warn&#x27;],
            breach: [&#x27;Breach&#x27;, &#x27;txterr&#x27;, &#x27;err&#x27;]
        };
        const [label, cls, dot] = statusMap[status] || [a.status || &#x27;—&#x27;, &#x27;&#x27;, &#x27;err&#x27;];
        const armed = a.armed === true;
        let body = `&lt;div class=&quot;state&quot;&gt;&lt;div&gt;&lt;span class=&quot;big ${cls}&quot; id=&quot;alarmState&quot;&gt;${E(T(label))}&lt;/span&gt;
            ${a.armedAt &gt; 0 &amp;&amp; armed ? `&lt;div class=&quot;sub&quot;&gt;${E(since(Date.now() / 1000 - a.armedAt))}&lt;/div&gt;` : &#x27;&#x27;}&lt;/div&gt;
            &lt;button class=&quot;toggle&quot; role=&quot;switch&quot; aria-checked=&quot;${armed}&quot; aria-label=&quot;Alarm&quot;&gt;&lt;/button&gt;&lt;/div&gt;`;
        if (a.breach) {
            body += `&lt;div class=&quot;state&quot;&gt;&lt;span class=&quot;txterr&quot;&gt;${icon(&#x27;triangle-exclamation&#x27;)} ${E(T(&#x27;Breach detected&#x27;))}&lt;/span&gt;&lt;/div&gt;`;
        }
        const profiles = a.profiles || [];
        if (profiles.length) {
            // Profilwechsel nur im unscharfen Zustand anbieten
            body += `&lt;div class=&quot;chips&quot; data-p=&quot;2&quot;&gt;${profiles.map((p) =&gt; `&lt;button class=&quot;chip ${p.id === a.currentProfile ? &#x27;on&#x27; : &#x27;&#x27;}&quot; data-profile=&quot;${E(p.id)}&quot; ${armed ? &#x27;disabled&#x27; : &#x27;&#x27;}&gt;${E(p.name)}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`;
        }
        body += rows([[T(&#x27;Active Profile&#x27;), has(a.profile) ? E(a.profile) : &#x27;&#x27;, 3]]);
        return head(&#x27;shield-halved&#x27;, a.name || &#x27;Alarm&#x27;, [T(&#x27;Alarm Profile&#x27;), has(a.profile) ? a.profile : &#x27;&#x27;].filter(has).join(&#x27;: &#x27;), dot) + body + &#x27;&lt;div class=&quot;foot&quot;&gt;&lt;/div&gt;&#x27;;
    }

    function renderWebhooks(w) {
        const hooks = w.hooks || [];
        const sub = `${num(hooks.length)} ${T(hooks.length === 1 ? &#x27;webhook&#x27; : &#x27;webhooks&#x27;)}`;
        let body;
        if (hooks.length) {
            body = `&lt;div class=&quot;hooks&quot;&gt;${hooks.map((h) =&gt; `&lt;button class=&quot;btn&quot; data-hook=&quot;${E(h.ident)}&quot;&gt;${icon(&#x27;bell-ring&#x27;)}&lt;span&gt;${E(h.name)}&lt;/span&gt;&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`;
        } else {
            body = `&lt;div class=&quot;empty&quot;&gt;${E(T(&#x27;No webhooks configured&#x27;))}&lt;/div&gt;`;
        }
        return head(&#x27;bell-ring&#x27;, w.name || &#x27;Webhooks&#x27;, sub, hooks.length ? &#x27;ok&#x27; : &#x27;warn&#x27;) + body + &#x27;&lt;div class=&quot;foot&quot;&gt;&lt;/div&gt;&#x27;;
    }

    const renderers = { device: renderDevice, events: renderEvents, alarm: renderAlarm, webhooks: renderWebhooks };

    function render() {
        if (!state || !state.kind || !renderers[state.kind]) {
            return;
        }
        if (state.inactive) {
            box.innerHTML = `&lt;div class=&quot;empty&quot;&gt;${E(T(&#x27;Instance inactive&#x27;))}&lt;/div&gt;`;
            return;
        }
        if (state.kind === &#x27;device&#x27; &amp;&amp; !state.name &amp;&amp; !state.model) {
            box.innerHTML = `&lt;div class=&quot;empty&quot;&gt;${E(T(&#x27;No data yet&#x27;))}&lt;/div&gt;`;
            return;
        }
        box.innerHTML = renderers[state.kind](state);
        box.classList.toggle(&#x27;off&#x27;, state.kind === &#x27;device&#x27; &amp;&amp; connState(state.state) === &#x27;err&#x27;);
        fit();
    }

    // Passt den Inhalt in die Kachel ein: erst die Groessenklassen, dann wird alles,
    // was mit data-p markiert ist, ausgeblendet (hoechste Zahl zuerst), bis nichts mehr ueberlaeuft.
    function fit() {
        const width = box.clientWidth - padSide * 2, height = box.clientHeight - padTop - padBottom;
        document.body.classList.toggle(&#x27;narrow&#x27;, width &lt; 200);
        document.body.classList.toggle(&#x27;short&#x27;, height &lt; 200);
        box.querySelectorAll(&#x27;.hid&#x27;).forEach((e) =&gt; e.classList.remove(&#x27;hid&#x27;));
        const overflow = () =&gt; box.scrollHeight &gt; box.clientHeight + 1;
        const steps = [...new Set([...box.querySelectorAll(&#x27;[data-p]&#x27;)].map((e) =&gt; Number(e.dataset.p)))].sort((a, b) =&gt; b - a);
        for (const step of steps) {
            if (!overflow()) {
                break;
            }
            const items = [...box.querySelectorAll(`[data-p=&quot;${step}&quot;]`)].reverse();
            for (const item of items) {
                if (!overflow()) {
                    break;
                }
                item.classList.add(&#x27;hid&#x27;);
            }
        }
    }

    window.handleMessage = (data) =&gt; {
        state = typeof data === &#x27;string&#x27; ? JSON.parse(data) : data;
        render();
    };

    let armTimer = null;
    box.addEventListener(&#x27;click&#x27;, (event) =&gt; {
        const snapshotButton = event.target.closest(&#x27;[data-snapshot]&#x27;);
        if (snapshotButton) {
            if (!snapshotButton.classList.contains(&#x27;busy&#x27;)) {
                snapshotButton.classList.add(&#x27;busy&#x27;);
                snapshotButton.querySelector(&#x27;span&#x27;).textContent = T(&#x27;Creating snapshot...&#x27;);
                requestAction(&#x27;snapshot&#x27;, 1);
                setTimeout(render, 8000);
            }
            return;
        }
        const hookButton = event.target.closest(&#x27;[data-hook]&#x27;);
        if (hookButton) {
            if (!hookButton.classList.contains(&#x27;busy&#x27;)) {
                hookButton.classList.add(&#x27;busy&#x27;);
                requestAction(hookButton.dataset.hook, 1);
                setTimeout(() =&gt; hookButton.classList.remove(&#x27;busy&#x27;), 3000);
            }
            return;
        }
        const profileChip = event.target.closest(&#x27;[data-profile]&#x27;);
        if (profileChip &amp;&amp; !profileChip.disabled) {
            box.querySelectorAll(&#x27;[data-profile]&#x27;).forEach((c) =&gt; c.classList.toggle(&#x27;on&#x27;, c === profileChip));
            requestAction(&#x27;CurrentProfile&#x27;, profileChip.dataset.profile);
            return;
        }
        const toggle = event.target.closest(&#x27;.toggle&#x27;);
        if (toggle) {
            const armed = toggle.getAttribute(&#x27;aria-checked&#x27;) === &#x27;true&#x27;;
            // Scharf-/Unscharfschalten ist sicherheitsrelevant: einmal bestaetigen lassen.
            if (!toggle.classList.contains(&#x27;armed&#x27;)) {
                toggle.classList.add(&#x27;armed&#x27;);
                document.getElementById(&#x27;alarmState&#x27;).textContent = T(armed ? &#x27;Tap again to disarm&#x27; : &#x27;Tap again to arm&#x27;);
                fit();
                clearTimeout(armTimer);
                armTimer = setTimeout(render, 4000);
                return;
            }
            clearTimeout(armTimer);
            toggle.classList.remove(&#x27;armed&#x27;);
            toggle.setAttribute(&#x27;aria-checked&#x27;, String(!armed));
            document.getElementById(&#x27;alarmState&#x27;).textContent = T(armed ? &#x27;Disarming&#x27; : &#x27;Arming&#x27;);
            requestAction(&#x27;Armed&#x27;, !armed);
        }
    });

    window.addEventListener(&#x27;resize&#x27;, fit);
    if (document.fonts &amp;&amp; document.fonts.ready) {
        document.fonts.ready.then(fit);
    }
    // Laufzeiten (Events aktiv seit, Alarm scharf seit) laufen zwischen zwei Updates weiter.
    setInterval(() =&gt; {
        if (state &amp;&amp; (state.kind === &#x27;events&#x27; || state.kind === &#x27;alarm&#x27;)) {
            render();
        }
    }, 60000);
    render();
&lt;/script&gt;

&lt;style&gt;
    :root {
        /* --accent-color, --content-color und --card-color liefert das HTML-SDK. */

&lt;div id=&quot;t&quot;&gt;&lt;/div&gt;

&lt;script&gt;

    // Namen kommen vom Controller (Geraetenamen etc.) und duerfen nie als Markup interpretiert werden.
    const E = (text) =&gt; String(text ?? &#x27;&#x27;).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, (c) =&gt; ({ &#x27;&amp;&#x27;: &#x27;&amp;amp;&#x27;, &#x27;&lt;&#x27;: &#x27;&amp;lt;&#x27;, &#x27;&gt;&#x27;: &#x27;&amp;gt;&#x27;, &#x27;&quot;&#x27;: &#x27;&amp;quot;&#x27;, &quot;&#x27;&quot;: &#x27;&amp;#39;&#x27; }[c]));
    const num = (value, digits = 0) =&gt; Number(value).toLocaleString(undefined, { minimumFractionDigits: digits, maximumFractionDigits: digits });

        if (d &gt; 0) {

        }
        return h &gt; 0 ? `${h} ${T(&#x27;h&#x27;)} ${m} ${T(&#x27;min&#x27;)}` : `${m} ${T(&#x27;min&#x27;)}`;

    const since = (seconds) =&gt; T(&#x27;since %s&#x27;).replace(&#x27;%s&#x27;, duration(seconds));

    const head = (iconName, name, sub, status = &#x27;ok&#x27;) =&gt; `&lt;div class=&quot;head&quot;&gt;

    const kpis = (items) =&gt; `&lt;div class=&quot;kpis&quot;&gt;${items.map(([value, label, cls = &#x27;&#x27;]) =&gt; `&lt;div class=&quot;kpi ${cls}&quot;&gt;&lt;div class=&quot;v&quot;&gt;${value}&lt;/div&gt;&lt;div class=&quot;l&quot;&gt;${E(label)}&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`;
    const bar = (label, percent, text, cls) =&gt; `&lt;div class=&quot;barx&quot;&gt;&lt;div class=&quot;r&quot;&gt;&lt;span&gt;${E(label)}&lt;/span&gt;&lt;span&gt;${E(text ?? `${num(percent)} %`)}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;track&quot;&gt;&lt;i class=&quot;${cls ?? &#x27;&#x27;}&quot; style=&quot;width:${clamp(percent)}%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;/div&gt;`;

    }

    const connLabel = (s) =&gt; T({ CONNECTED: &#x27;Connected&#x27;, CONNECTING: &#x27;Connecting&#x27;, DISCONNECTED: &#x27;Disconnected&#x27; }[s] || (s || &#x27;Disconnected&#x27;));

    const deviceIcons = {
        &#x27;Camera&#x27;: &#x27;camera-cctv&#x27;, &#x27;UP-Sense&#x27;: &#x27;sensor&#x27;, &#x27;UP-AirQuality&#x27;: &#x27;wind&#x27;,
        &#x27;Chime&#x27;: &#x27;bell&#x27;, &#x27;Light&#x27;: &#x27;lightbulb&#x27;, &#x27;Speaker&#x27;: &#x27;speaker&#x27;, &#x27;Viewer&#x27;: &#x27;display&#x27;
    };

    function renderDevice(d) {
        const type = d.type || &#x27;Camera&#x27;;
        const sub = [d.model, connLabel(d.state)].filter(has).join(&#x27; · &#x27;);
        let body = &#x27;&#x27;;
        if (type === &#x27;Camera&#x27;) {
            const items = [];
            if (has(d.micVolume)) {
                items.push([`${num(d.micVolume)}&lt;small&gt; %&lt;/small&gt;`, T(&#x27;Microphone Volume&#x27;)]);
            }
            if (d.micEnabled !== undefined &amp;&amp; d.micEnabled !== null) {
                items.push([`&lt;span class=&quot;${d.micEnabled ? &#x27;txtok&#x27; : &#x27;&#x27;}&quot;&gt;${E(T(d.micEnabled ? &#x27;On&#x27; : &#x27;Off&#x27;))}&lt;/span&gt;`, T(&#x27;Microphone&#x27;), &#x27;wide-only&#x27;]);

            }
            body += rows([[T(&#x27;LCD Message&#x27;), has(d.lcdMessage) ? E(d.lcdMessage) : &#x27;&#x27;, 3]]);
            body += `&lt;div data-p=&quot;2&quot;&gt;&lt;button class=&quot;btn&quot; data-snapshot&gt;${icon(&#x27;camera-polaroid&#x27;)}&lt;span&gt;${E(T(&#x27;Create snapshot&#x27;))}&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;`;
        } else if (type === &#x27;Speaker&#x27;) {

            }

            }

            }
            body += rows([
                [T(&#x27;Vape Index&#x27;), has(d.vape) ? num(d.vape) : &#x27;&#x27;, 3],
                [&#x27;TVOC&#x27;, has(d.tvoc) ? `${num(d.tvoc)} ppb` : &#x27;&#x27;, 4],
                [&#x27;VOC&#x27;, has(d.voc) ? num(d.voc) : &#x27;&#x27;, 5],

                [&#x27;PM4.0&#x27;, has(d.pm4) ? `${num(d.pm4, 1)} µg/m³` : &#x27;&#x27;, 6],

        return head(deviceIcons[type] || &#x27;circle-nodes&#x27;, d.name || type, sub, connState(d.state)) + body + &#x27;&lt;div class=&quot;foot&quot;&gt;&lt;/div&gt;&#x27;;
    }

    const eventLabels = {
        motion: &#x27;Motion&#x27;, smartDetectZone: &#x27;Smart Detection&#x27;, smartDetectLine: &#x27;Line crossing&#x27;,
        smartDetectLoiterZone: &#x27;Loitering&#x27;, smartAudioDetect: &#x27;Audio detection&#x27;, ring: &#x27;Ring&#x27;,
        sensorMotion: &#x27;Sensor motion&#x27;, sensorExtremeValues: &#x27;Extreme values&#x27;, sensorWaterLeak: &#x27;Water leak&#x27;,
        sensorTamper: &#x27;Tamper&#x27;, sensorBatteryLow: &#x27;Battery low&#x27;, sensorAlarm: &#x27;Alarm&#x27;,

    };
    const eventLabel = (type) =&gt; T(eventLabels[type] || type);
